services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: carby
      POSTGRES_PASSWORD: carby
      POSTGRES_DB: carby
    volumes:
      - carby-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U carby -d carby"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  carby-postgres-data:
